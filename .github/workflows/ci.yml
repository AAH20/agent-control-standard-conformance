name: ACS Conformance Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: acs-conformance run --pack packs/core.json --output report.json --junit report.xml --sarif report.sarif --fail-below L5
      - run: acs-conformance economics fixtures/economics.json --output economics.json
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence-${{ matrix.python-version }}
          path: |
            report.json
            report.xml
            report.sarif
            economics.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t acs-conformance:test .
      - run: docker run --rm acs-conformance:test run --pack packs/core.json --output /tmp/report.json --fail-below L5
